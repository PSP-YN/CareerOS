<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#10251f"><title>CareerOS Question Admin</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/admin.css"></head><body><a class="skip-link" href="#adminMain">Skip to administration</a><main class="admin-wrap" id="adminMain" tabindex="-1"><header class="admin-top"><div><div class="eyebrow">CAREEROS / ADMINISTRATION</div><h1>Interview question bank</h1><p class="muted">Manage curated questions for all seven interview rounds.</p></div><a class="btn" href="/app">Back to workspace</a></header><div id="adminStatus" class="admin-status" role="status">Checking administrator access…</div><section class="admin-grid" id="adminContent" hidden><article class="card"><h2 id="formTitle">Add a question</h2><form class="admin-form" id="questionForm"><label>Interview round<select id="round" required><option value="aptitude">Aptitude</option><option value="coding">Coding</option><option value="technical">Technical</option><option value="system_design">System design</option><option value="case_study">Case study</option><option value="behavioral">Behavioral</option><option value="hr">HR</option></select></label><label>Difficulty<select id="difficulty"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></label><label>Question<textarea id="question" rows="5" minlength="20" maxlength="2000" required></textarea></label><label>Evaluation rubric<textarea id="rubric" rows="4" minlength="10" maxlength="2000" required></textarea></label><div class="actions"><button class="btn primary" type="submit" id="saveQuestion">Add question</button><button class="btn" type="button" id="cancelEdit" hidden>Cancel edit</button></div></form></article><article class="card"><div class="row"><h2>Published questions</h2><button class="btn" id="refreshQuestions" type="button">Refresh</button></div><div class="admin-list" id="questionList"></div></article></section></main><script type="module" src="/js/admin.js"></script></body></html>
