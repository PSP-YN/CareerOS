<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#10251f"><title>CareerOS Question Admin</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><style>
.admin-wrap{max-width:1080px;margin:36px auto;padding:0 20px}.admin-grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:18px}.admin-list{display:grid;gap:10px}.admin-item{border:1px solid #dce5de;border-radius:12px;padding:14px;background:#fff}.admin-item p{margin:8px 0;color:#53645a}.admin-item .actions{display:flex;gap:8px;flex-wrap:wrap}.admin-status{padding:12px;border-radius:10px;background:#f2f6f2;margin:12px 0}.admin-form{display:grid;gap:12px}.admin-form label{display:grid;gap:6px;font-size:13px;font-weight:600}.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:8px;font:inherit}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin-wrap"><header class="admin-top"><div><div class="eyebrow">CAREEROS / ADMINISTRATION</div><h1>Interview question bank</h1><p class="muted">Manage curated questions for all seven interview rounds.</p></div><a class="btn" href="/app">Back to workspace</a></header><div id="adminStatus" class="admin-status" role="status">Checking administrator access…</div><section class="admin-grid" id="adminContent" hidden><article class="card"><h2 id="formTitle">Add a question</h2><form class="admin-form" id="questionForm"><label>Interview round<select id="round" required><option value="aptitude">Aptitude</option><option value="coding">Coding</option><option value="technical">Technical</option><option value="system_design">System design</option><option value="case_study">Case study</option><option value="behavioral">Behavioral</option><option value="hr">HR</option></select></label><label>Difficulty<select id="difficulty"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></label><label>Question<textarea id="question" rows="5" minlength="20" maxlength="2000" required></textarea></label><label>Evaluation rubric<textarea id="rubric" rows="4" minlength="10" maxlength="2000" required></textarea></label><div class="actions"><button class="btn primary" type="submit" id="saveQuestion">Add question</button><button class="btn" type="button" id="cancelEdit" hidden>Cancel edit</button></div></form></article><article class="card"><div class="row"><h2>Published questions</h2><button class="btn" id="refreshQuestions" type="button">Refresh</button></div><div class="admin-list" id="questionList"></div></article></section></main><script type="module" src="/admin.js"></script></body></html>
