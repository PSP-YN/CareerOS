name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Type the exact Supabase project reference to confirm the deployment target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply reviewed database migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate explicit deployment target
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.confirm_target }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test "$INPUT_TARGET" = "$PROJECT_REF" || { echo "Confirmation does not match configured project ref"; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "Invalid Supabase project reference format"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link target and apply migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --remote
          supabase db push --yes --remote
          supabase migration list --linked
