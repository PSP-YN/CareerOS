name: Supabase schema deployment

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Exact 20-character Supabase project reference to deploy to"
        required: true
        type: string
      confirm_project_ref:
        description: "Re-enter the exact project reference to authorize deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: careeros-supabase-production-${{ inputs.project_ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.project_ref != '' && inputs.project_ref == inputs.confirm_project_ref }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Validate credentials and target
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Invalid Supabase project reference"; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "$CONFIRM_PROJECT_REF" || { echo "::error::Project confirmation does not match"; exit 1; }

      - name: Authenticate Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link target project
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes --remote="$SUPABASE_PROJECT_REF"

      - name: Verify remote migration history
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --remote="$SUPABASE_PROJECT_REF"
