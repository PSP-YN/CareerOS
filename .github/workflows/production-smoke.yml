name: Production smoke test
on:
  workflow_run:
    workflows: ["Verify CareerOS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional main commit SHA to verify against production
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested main revision
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Skip smoke for superseded main commits
        id: freshness
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$EXPECTED_COMMIT" ] && [ "$current" != "$EXPECTED_COMMIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Main has advanced to $current; skipping stale smoke for $EXPECTED_COMMIT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Vercel production deployment to match tested commit
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          base="https://careeros-intelligence.vercel.app"
          ready=0
          for attempt in $(seq 1 30); do
            config=$(curl --silent --show-error --fail --max-time 15 "$base/api/config?release-check=$EXPECTED_COMMIT" || true)
            actual=$(echo "$config" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).gitCommit||'')}catch{}})")
            if [ -n "$config" ] && { [ -z "$EXPECTED_COMMIT" ] || [ "$actual" = "$EXPECTED_COMMIT" ]; }; then
              ready=1
              echo "Production commit: $actual"
              break
            fi
            echo "Production commit not updated yet ($attempt/30); expected $EXPECTED_COMMIT, got $actual"
            sleep 10
          done
          test "$ready" = "1" || { echo "Production deployment did not match the tested commit"; exit 1; }

      - name: Check public pages, crawler endpoints and response security headers
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://careeros-intelligence.vercel.app"
          for path in / /about /pricing /career-pivot-guide /app /robots.txt /sitemap.xml /llms.txt /llms-full.txt; do
            code=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 20 "$base$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          curl --silent --show-error --output /dev/null --dump-header "$headers" --max-time 20 "$base/"
          for expected in "x-content-type-options: nosniff" "x-frame-options: DENY" "strict-transport-security:" "content-security-policy:" "referrer-policy:" "permissions-policy:"; do
            grep -Eiq "^$(printf '%s' "$expected" | sed 's/[.[\*^$()+?{|]/\\&/g')" "$headers" || { echo "Missing security header: $expected"; cat "$headers"; exit 1; }
          done
          echo "Required browser security headers are present."

      - name: Check public API contracts and authentication boundaries
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://careeros-intelligence.vercel.app"
          config=$(curl --silent --show-error --fail --max-time 20 "$base/api/config")
          echo "$config" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);if(!c.supabaseUrl||!c.supabaseAnonKey||c.billingEnabled!==false)process.exit(1);for(const k of Object.keys(c))if(/service.role|gemini.api.key|secret|password/i.test(k))process.exit(2);console.log('Public config contract and free-pilot billing state are valid')})"

          questions=$(curl --silent --show-error --fail --max-time 20 "$base/api/questions")
          echo "$questions" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const q=JSON.parse(s);if(!Array.isArray(q.questions))process.exit(1);console.log('Question API returns a valid array contract ('+q.questions.length+' database records; local curated bank remains available)')})"

          check_status() {
            local method="$1" path="$2" expected="$3" body="${4:-}"
            local args=(-sS -o /tmp/careeros-response -w "%{http_code}" -X "$method" --max-time 20)
            if [ -n "$body" ]; then args+=(-H "Content-Type: application/json" --data "$body"); fi
            local actual
            actual=$(curl "${args[@]}" "$base$path")
            echo "$method $path -> $actual (expected $expected)"
            test "$actual" = "$expected"
          }
          check_status POST /api/config 405 '{}'
          check_status POST /api/questions 405 '{}'
          check_status GET /api/admin-questions 401
          check_status POST /api/admin-questions 401 '{}'
          check_status GET /api/coach 405
          check_status POST /api/coach 401 '{}'
          echo "Public API methods and unauthenticated access boundaries passed."
